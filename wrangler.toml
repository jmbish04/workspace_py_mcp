name = "workspace-mcp-edge"
main = "src/index.ts"
compatibility_date = "2024-04-03"

# Node.js compatibility is required for some built-in modules if used,
# though we are aiming for edge-native.
compatibility_flags = ["nodejs_compat"]

# KV Namespaces for Cache and Agent Memory
[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "workspace_cache_id" # Replace with actual ID after creation
preview_id = "workspace_cache_preview_id"

[[kv_namespaces]]
binding = "AGENT_MEMORY"
id = "agent_memory_id" # Replace with actual ID after creation
preview_id = "agent_memory_preview_id"

# D1 Database for Interactions Log and Saved Prompts
[[d1_databases]]
binding = "DB"
database_name = "workspace_mcp_db"
database_id = "workspace_mcp_db_id" # Replace with actual ID after creation
migrations_dir = "./migrations"

# Vectorize Database for Semantic Search
[[vectorize]]
binding = "WORKSPACE_INDEX"
index_name = "workspace-mcp-index"

# Workers AI for Embeddings
[ai]
binding = "AI"
